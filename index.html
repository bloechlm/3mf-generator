<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>3MF Generator v1.0</title><style>*{box-sizing:border-box}body{margin:0;background:#10131a;color:#f4f6fc;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:760px;margin:auto;padding:18px}h1{font-size:24px;margin:8px 0}p{color:#b3bfd0;font-size:14px}.viewer{position:relative;height:350px;background:linear-gradient(#222c3b,#111823);border:1px solid #3a475a;border-radius:16px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}svg{width:100%;height:100%;display:block;touch-action:none}.hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#c3cedb;font-size:12px;pointer-events:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}label{font-size:13px;color:#bdc9d9}input{width:100%;margin-top:6px;padding:12px 8px;border:1px solid #526177;background:#1b2533;color:white;border-radius:10px;font-size:17px}button{width:100%;border:0;border-radius:12px;background:#4b91ff;color:white;font-size:17px;font-weight:650;padding:16px;margin:8px 0}.small{background:#293749}.status{min-height:22px;color:#a9dfb4;font-size:13px;margin-top:12px}footer{font-size:12px;color:#8c9aae;margin-top:12px}</style></head><body><main><h1>3MF Würfelgenerator <small style="font-size:12px;color:#9db1cc">v1.0</small></h1><p>Quader parametrisieren, drehen, zoomen und als 3MF exportieren.</p><div class="viewer" id="viewer"><svg id="scene" viewBox="0 0 360 350" xmlns="http://www.w3.org/2000/svg" aria-label="3D Vorschau"><g id="cube"><polygon points="180,64 280,117 180,169 80,117" fill="#78b6ff" stroke="#142b4d" stroke-width="2"/><polygon points="80,117 180,169 180,286 80,233" fill="#3277c6" stroke="#142b4d" stroke-width="2"/><polygon points="180,169 280,117 280,233 180,286" fill="#488be4" stroke="#142b4d" stroke-width="2"/></g></svg><div class="hint">1 Finger: Drehen · 2 Finger: Zoomen</div></div><div class="grid"><label>Breite X (mm)<input id="x" type="number" min="0.1" max="10000" step="1" value="30"></label><label>Tiefe Y (mm)<input id="y" type="number" min="0.1" max="10000" step="1" value="30"></label><label>Höhe Z (mm)<input id="z" type="number" min="0.1" max="10000" step="1" value="30"></label></div><label>Kantenradius (mm)<input id="radius" type="number" min="0" max="5000" step="0.5" value="2"></label><button id="save">3MF erstellen / teilen</button><button id="reset" class="small">Ansicht zurücksetzen</button><div class="status" id="status" role="status">Statische Vorschau geladen – JavaScript wird geprüft …</div><footer>3MF · Millimeter · geschlossenes Dreiecksnetz</footer></main><script>
(function(){'use strict';var svg=document.getElementById('scene'),cube=document.getElementById('cube'),viewer=document.getElementById('viewer'),status=document.getElementById('status');var ax=-0.48,ay=0.72,zoom=1,active={},lastPinch=0;var radiusField=document.getElementById('radius');var fields=['x','y','z'].map(function(id){return document.getElementById(id)});function dims(){return fields.map(function(e){return Math.max(.1,Math.min(10000,Number(e.value)||.1))})}function radius(){var d=dims();return Math.max(0,Math.min(Math.min.apply(null,d)/2,Number(radiusField.value)||0))}
function mesh(){var d=dims(),r=radius(),v=[],t=[],outlines=[],map=new Map(),N=r>0?12:1;
function add(p){var key=p.map(q=>q.toFixed(7)).join(',');if(map.has(key))return map.get(key);var id=v.length;v.push(p);map.set(key,id);return id}
for(var axis=0;axis<3;axis++)for(var sign of [-1,1]){var u=(axis+1)%3,w=(axis+2)%3,grid=[];
for(var j=0;j<=N;j++){var row=[];for(var i=0;i<=N;i++){var p=[0,0,0];p[axis]=sign*d[axis]/2;p[u]=(i/N-.5)*d[u];p[w]=(j/N-.5)*d[w];var q=p.map((x,k)=>Math.max(-d[k]/2+r,Math.min(d[k]/2-r,x)));var delta=p.map((x,k)=>x-q[k]);var len=Math.hypot(...delta);row.push(add(q.map((x,k)=>x+(len?r*delta[k]/len:0))))}grid.push(row)}
outlines.push({axis:axis,sign:sign,ids:[...grid[0],...grid.slice(1).map(row=>row[N]),...grid[N-1].slice(0,N).reverse(),...grid.slice(1,N-1).reverse().map(row=>row[0])]});for(var j=0;j<N;j++)for(var i=0;i<N;i++){var a=grid[j][i],b=grid[j][i+1],c=grid[j+1][i+1],e=grid[j+1][i];if(sign*(axis===1?-1:1)>0)t.push([a,b,c],[a,c,e]);else t.push([a,c,b],[a,e,c])}}
return {v:v,t:t,outlines:outlines}}
function render(){var d=dims(),m=mesh(),max=Math.max(...d),scale=195*zoom/max,ca=Math.cos(ax),sa=Math.sin(ax),cb=Math.cos(ay),sb=Math.sin(ay);
var verts=m.v.map(function(p){var X=p[0],Y=p[1],Z=p[2];var xx=X*cb+Y*sb,yy=-X*sb+Y*cb,y2=yy*ca-Z*sa,z2=yy*sa+Z*ca;return{x:180+xx*scale,y:175-y2*scale,z:z2}});
var faces=m.t.map(function(ids){var a=verts[ids[0]],b=verts[ids[1]],c=verts[ids[2]];var shade=Math.max(.56,Math.min(1.1,.78+((b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x)>0?.12:-.06)));return{ids:ids,depth:(a.z+b.z+c.z)/3,shade:shade}}).sort((a,b)=>a.depth-b.depth);
cube.replaceChildren();var fragment=document.createDocumentFragment();faces.forEach(function(f){var el=document.createElementNS('http://www.w3.org/2000/svg','polygon');el.setAttribute('points',f.ids.map(n=>verts[n].x.toFixed(2)+','+verts[n].y.toFixed(2)).join(' '));var light=Math.round(75*f.shade),green=Math.round(145*f.shade),blue=Math.round(235*f.shade);el.setAttribute('fill','rgb('+light+','+green+','+blue+')');fragment.appendChild(el)});cube.appendChild(fragment);m.outlines.forEach(function(face){var normal=[0,0,0];normal[face.axis]=face.sign;var nz=normal[2]*ca+(normal[1]*cb-normal[0]*sb)*sa;if(nz<=0)return;var line=document.createElementNS('http://www.w3.org/2000/svg','polygon');line.setAttribute('points',face.ids.map(n=>verts[n].x.toFixed(2)+','+verts[n].y.toFixed(2)).join(' '));line.setAttribute('fill','none');line.setAttribute('stroke','#152b4b');line.setAttribute('stroke-width','2');line.setAttribute('stroke-linejoin','round');cube.appendChild(line)})}
function count(){return Object.keys(active).length}function pointDist(){var a=Object.keys(active);if(a.length<2)return 0;var p=active[a[0]],q=active[a[1]];return Math.hypot(p.x-q.x,p.y-q.y)}function begin(id,x,y){active[id]={x:x,y:y};lastPinch=pointDist()}function move(id,x,y){if(!active[id])return;var p=active[id],dx=x-p.x,dy=y-p.y;active[id]={x:x,y:y};if(count()===1){ay-=dx*.012;ax+=dy*.012}else if(count()>=2){var dist=pointDist();if(lastPinch)zoom=Math.max(.15,Math.min(8,zoom*dist/lastPinch));lastPinch=dist}render()}function end(id){delete active[id];lastPinch=pointDist()}if(window.PointerEvent){viewer.addEventListener('pointerdown',function(e){e.preventDefault();begin(e.pointerId,e.clientX,e.clientY);try{viewer.setPointerCapture(e.pointerId)}catch(_){}});viewer.addEventListener('pointermove',function(e){if(active[e.pointerId]){e.preventDefault();move(e.pointerId,e.clientX,e.clientY)}});['pointerup','pointercancel','lostpointercapture'].forEach(function(n){viewer.addEventListener(n,function(e){end(e.pointerId)})})}else{viewer.addEventListener('touchstart',function(e){e.preventDefault();Array.from(e.changedTouches).forEach(function(t){begin(t.identifier,t.clientX,t.clientY)})},{passive:false});viewer.addEventListener('touchmove',function(e){e.preventDefault();Array.from(e.changedTouches).forEach(function(t){move(t.identifier,t.clientX,t.clientY)})},{passive:false});['touchend','touchcancel'].forEach(function(n){viewer.addEventListener(n,function(e){Array.from(e.changedTouches).forEach(function(t){end(t.identifier)})})});var dragging=false;viewer.addEventListener('mousedown',function(e){dragging=true;begin('mouse',e.clientX,e.clientY)});window.addEventListener('mousemove',function(e){if(dragging)move('mouse',e.clientX,e.clientY)});window.addEventListener('mouseup',function(){dragging=false;end('mouse')})}viewer.addEventListener('wheel',function(e){e.preventDefault();zoom=Math.max(.15,Math.min(8,zoom*Math.exp(-e.deltaY*.001)));render()},{passive:false});fields.concat([radiusField]).forEach(function(f){f.addEventListener('input',render);f.addEventListener('change',render)});document.getElementById('reset').addEventListener('click',function(){ax=-.48;ay=.72;zoom=1;render()});
// ZIP writer: stored entries, CRC32 and central directory; no external dependencies.
const enc=new TextEncoder();const table=new Uint32Array(256);for(let n=0;n<256;n++){let q=n;for(let k=0;k<8;k++)q=(q&1)?(0xedb88320^(q>>>1)):(q>>>1);table[n]=q>>>0}function crc(data){let q=0xffffffff;for(const b of data)q=table[(q^b)&255]^(q>>>8);return(q^0xffffffff)>>>0}function u16(v){return[v&255,(v>>>8)&255]}function u32(v){return[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255]}function zip(files){const local=[],central=[];let offset=0;for(const [name,content] of files){const n=enc.encode(name),d=enc.encode(content),check=crc(d);const l=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(check),...u32(d.length),...u32(d.length),...u16(n.length),...u16(0),...n,...d]);local.push(l);central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(check),...u32(d.length),...u32(d.length),...u16(n.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...n]));offset+=l.length}const centralSize=central.reduce((s,a)=>s+a.length,0),end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(centralSize),...u32(offset),...u16(0)]);return new Blob([...local,...central,end],{type:'model/3mf'})}function make3mf(){const m=mesh(),V=m.v,T=m.t;const xml=`<?xml version="1.0" encoding="UTF-8"?><model unit="millimeter" xml:lang="de-DE" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02"><resources><object id="1" type="model" name="Quader"><mesh><vertices>${V.map(p=>`<vertex x="${p[0]}" y="${p[1]}" z="${p[2]}"/>`).join('')}</vertices><triangles>${T.map(t=>`<triangle v1="${t[0]}" v2="${t[1]}" v3="${t[2]}"/>`).join('')}</triangles></mesh></object></resources><build><item objectid="1"/></build></model>`;return zip([['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/></Types>'],['_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>'],['3D/3dmodel.model',xml]])}
document.getElementById('save').onclick=async()=>{try{const blob=make3mf(),file=new File([blob],'Quader_'+dims().join('x')+'mm.3mf',{type:'model/3mf'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'3MF Quader'});status.textContent='3MF-Datei zum Teilen bereitgestellt.'}else{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent='3MF-Datei erstellt.'}}catch(e){status.textContent=e.name==='AbortError'?'Teilen abgebrochen.':'Fehler: '+e.message}};render();status.textContent='Interaktive Vorschau aktiv.';})();
</script></body></html>
